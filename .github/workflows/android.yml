name: Android CI

on:
  push:
    branches-ignore: [ci-reports]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish-ci-report.sh pushes logs and screenshots to the ci-reports branch

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, test, lint, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee ../ci-assemble.log; exit ${PIPESTATUS[0]}

      - name: Unit tests and screenshots (Robolectric + Roborazzi)
        id: tests
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew recordRoborazziDebug --stacktrace 2>&1 | tee ../ci-tests.log; exit ${PIPESTATUS[0]}

      - name: Android lint
        id: lint
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee ../ci-lint.log; exit ${PIPESTATUS[0]}

      - name: Publish report to ci-reports branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: bash .github/scripts/publish-ci-report.sh

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-coach-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-coach-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if any check failed
        if: steps.assemble.outcome != 'success' || steps.tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: |
          echo "assemble=${{ steps.assemble.outcome }} tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }}"
          exit 1
