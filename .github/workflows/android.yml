name: Android CI

on:
  # Pushes cover PR branches too (the PR shows the head commit's checks), so there is no
  # separate pull_request trigger: each push runs once, which halves Actions minutes.
  push:
    branches-ignore: [ci-reports]
  workflow_dispatch:

permissions:
  contents: write   # publish-ci-report.sh pushes to the ci-reports branch; the release job publishes builds

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every CI build gets a higher version code than the last one, so it installs over it.
  KAIJU_BUILD_NUMBER: ${{ github.run_number }}
  # Public signing certificates (fingerprints, not secrets). The keys themselves live only in the
  # KAIJU_SIGNING_BUNDLE secret; see docs/10-personal-builds.md. An APK signed by anything else
  # can't update the app on the phone, so it is never published.
  RELEASE_CERT_SHA256: 36f0a2f205a365e6d52d8e6392f07d5ecb714ad1bb3d5a066f3be31db53cf28e
  CI_DEBUG_CERT_SHA256: 68e0a664047a986dcc70675dde76909bf84afeac4156a3509cd3cd4eef37b3e1

jobs:
  android:
    name: Build, test, lint, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the CI debug key
        id: keys
        env:
          KAIJU_SIGNING_BUNDLE: ${{ secrets.KAIJU_SIGNING_BUNDLE }}
        run: bash .github/scripts/unpack-signing.sh ci-debug

      - name: Make a throwaway release key (proves the release build signs; never published)
        shell: bash
        run: |
          D="${KAIJU_SIGNING_DIR:-$RUNNER_TEMP/kaiju-signing}"
          mkdir -p "$D" && chmod 700 "$D"
          openssl rand -hex 24 > "$D/release.password"
          keytool -genkeypair -keystore "$D/release.p12" -storetype PKCS12 -alias kaiju-coach-release \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway CI check" \
            -storepass:file "$D/release.password" -keypass:file "$D/release.password" -noprompt
          echo "KAIJU_SIGNING_DIR=$D" >> "$GITHUB_ENV"

      - name: Assemble debug and release APKs
        id: assemble
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee ../ci-assemble.log; exit ${PIPESTATUS[0]}

      - name: Check the APK signatures
        id: signing
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          # With the secret, debug builds must carry the stable CI debug key (or the phone can't update them).
          EXPECTED=any; [ "${{ steps.keys.outputs.signed }}" = true ] && EXPECTED="$CI_DEBUG_CERT_SHA256"
          ls android/app/build/outputs/apk/*/ > ci-signing.log
          {
            bash .github/scripts/check-apk.sh android/app/build/outputs/apk/debug/app-debug.apk "$EXPECTED" &&
            bash .github/scripts/check-apk.sh android/app/build/outputs/apk/release/app-release.apk any
          } 2>&1 | tee -a ci-signing.log

      - name: Unit tests and screenshots (Robolectric + Roborazzi)
        id: tests
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew recordRoborazziDebug --stacktrace 2>&1 | tee ../ci-tests.log; exit ${PIPESTATUS[0]}

      - name: Android lint
        id: lint
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew lintDebug 2>&1 | tee ../ci-lint.log; exit ${PIPESTATUS[0]}

      - name: Publish report to ci-reports branch
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          SIGNING: ${{ steps.signing.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: bash .github/scripts/publish-ci-report.sh

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-coach-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-coach-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if any check failed
        if: steps.assemble.outcome != 'success' || steps.signing.outcome != 'success' || steps.tests.outcome != 'success' || steps.lint.outcome != 'success'
        run: |
          echo "assemble=${{ steps.assemble.outcome }} signing=${{ steps.signing.outcome }} tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }}"
          exit 1

  device:
    # Earl's own phone first (Pixel 9 on Android 17), plus an older Android for breadth.
    # These names are required checks on main; rename them in the branch rules too.
    name: Device run (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Pixel 9, Android 17
            api-level: '37.0'       # Android 17's emulator images are named android-37.0
            profile: pixel_9
            report: device          # also publishes the APKs android/scripts/run-on-phone.sh uses
          - device: Pixel 7, Android 15
            api-level: 35
            profile: pixel_7
            report: device-api35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Unpack the CI debug key
        env:
          KAIJU_SIGNING_BUNDLE: ${{ secrets.KAIJU_SIGNING_BUNDLE }}
        run: bash .github/scripts/unpack-signing.sh ci-debug

      - name: Build app and instrumented test APKs
        id: build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee ../ci-device-build.log; exit ${PIPESTATUS[0]}

      - name: Keep the APKs for running the same test on a phone
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p device-out/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk device-out/apk/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk device-out/apk/

      - name: Run the class flow on the emulator (${{ matrix.device }})
        id: device
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android
          script: bash ../.github/scripts/run-device-tests.sh

      - name: Publish device report to ci-reports branch
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_KIND: device
          REPORT_FOLDER: ${{ matrix.report }}
          BUILD: ${{ steps.build.outcome }}
          DEVICE: ${{ steps.device.outcome }}
        run: bash .github/scripts/publish-ci-report.sh

      - name: Upload device screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-coach-${{ matrix.report }}-run
          path: |
            device-out/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if the device run failed
        if: steps.build.outcome != 'success' || steps.device.outcome != 'success'
        run: |
          echo "build=${{ steps.build.outcome }} device=${{ steps.device.outcome }}"
          exit 1

  release:
    # Only for main, and only after every check above has passed.
    name: Publish personal build
    needs: [android, device]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the release key
        id: keys
        env:
          KAIJU_SIGNING_BUNDLE: ${{ secrets.KAIJU_SIGNING_BUNDLE }}
        run: bash .github/scripts/unpack-signing.sh release

      - name: Build the personal APK
        if: steps.keys.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Confirm it is signed with the personal key
        id: check
        if: steps.keys.outputs.signed == 'true'
        run: bash .github/scripts/check-apk.sh android/app/build/outputs/apk/release/app-release.apk "$RELEASE_CERT_SHA256"

      - name: Publish it as the latest release
        if: steps.keys.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_SHA256: ${{ steps.check.outputs.CERT_SHA256 }}
        run: bash .github/scripts/publish-personal-build.sh
